services:
  alumap:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data

  # Web UI for the database: http://<server>:8080
  # Writes from here bypass the app: e.g. deleting user_badges rows lets automatic badges come back.
  db-admin:
    image: ghcr.io/coleifer/sqlite-web:latest
    restart: unless-stopped
    command: sqlite_web --host 0.0.0.0 --port 8080 --no-browser /data/db.sqlite
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data
    depends_on:
      - alumap
